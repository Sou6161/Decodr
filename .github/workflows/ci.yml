name: ci

# Typecheck and test every push and pull request. The suites need no database:
# the data layer is mocked, and DATABASE_URL only has to pass env validation.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:types
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      # Typecheck does not run the bundler. A Vite build can still fail — an
      # unresolved import, a bad env reference — and that is what Vercel runs.
      - run: npm run build
